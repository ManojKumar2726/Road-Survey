<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Survey — Control Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1117'/><circle cx='16' cy='16' r='7' fill='%23e74c3c'/></svg>">
<!-- Leaflet is vendored, not CDN-loaded: a demo must not depend on venue wifi
     for its own map library. Tiles still need the network; the page degrades
     to routes and markers on a plain background without them. -->
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>Road Survey</h1>
      <p>Centralized urban intelligence · Chennai fleet</p>
    </div>
  </div>
  <div class="live">
    <span id="conn" class="pill pill-idle">connecting…</span>
    <span class="muted" id="clock"></span>
  </div>
</header>

<section class="kpis" id="kpis">
  <div class="kpi"><span class="kpi-label">Defects</span><span class="kpi-value" id="k-defects">—</span><span class="kpi-sub" id="k-defects-sub">tracked</span></div>
  <div class="kpi"><span class="kpi-label">Sightings</span><span class="kpi-value" id="k-events">—</span><span class="kpi-sub">raw events</span></div>
  <div class="kpi"><span class="kpi-label">Buses reporting</span><span class="kpi-value" id="k-buses">—</span><span class="kpi-sub" id="k-routes">— routes</span></div>
  <div class="kpi"><span class="kpi-label">Damage score</span><span class="kpi-value" id="k-score">—</span><span class="kpi-sub">severity-weighted</span></div>
  <div class="kpi kpi-wide"><span class="kpi-label">By damage type</span><div class="chips" id="k-types"></div></div>
</section>

<main>
  <section class="mapwrap">
    <div id="map"></div>
    <div class="maptools">
      <div class="seg" id="layer-toggle">
        <button data-layer="defects" class="on">Defects</button>
        <button data-layer="events">Sightings</button>
      </div>
      <label class="chk"><input type="checkbox" id="heat"> Heatmap</label>
      <label class="chk"><input type="checkbox" id="follow" checked> Follow new</label>
      <button id="fit" class="ghost" title="Zoom to the current findings">Fit</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="tablewrap">
    <div class="tablehead">
      <h2 id="table-title">Database — defects</h2>
      <div class="filters">
        <select id="f-type"><option value="">All damage types</option></select>
        <select id="f-status">
          <option value="">Any status</option>
          <option value="unconfirmed">Unconfirmed</option>
          <option value="open">Open</option>
          <option value="repaired">Repaired</option>
        </select>
        <span class="muted" id="rowcount"></span>
      </div>
    </div>
    <div class="tablescroll">
      <table id="tbl">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="detail" class="detail hidden">
  <div class="detail-head">
    <h3 id="d-title">Defect</h3>
    <button id="d-close" aria-label="Close">×</button>
  </div>
  <div class="detail-body" id="d-body"></div>
</div>

<script src="/static/vendor/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
