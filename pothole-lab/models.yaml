# =============================================================================
# Model registry for the pothole-detection lab.
#
# Adding a model = adding a block here. Nothing else to change.
#
# source: hf           -> pulled from the Hugging Face Hub (cached in weights/hf)
#         local        -> a .pt file on disk (path relative to the repo root)
#         ultralytics  -> a stock ultralytics checkpoint name (auto-downloaded)
#
# Weights download lazily, on the first run that actually uses the model, so
# leaving many entries enabled costs nothing until you select one.
#
# Optional per-model knobs (become the UI defaults when the model is picked):
#   default_conf, default_iou, default_imgsz, class_names, notes, enabled
# =============================================================================

models:
  # --------------------------------------------------------------------------
  # Starting point.
  # --------------------------------------------------------------------------
  - id: samdutse-yolov8
    name: "Samdutse - pothole yolov8"
    source: hf
    repo_id: Samdutse/pothole-yolov8
    filename: best.pt
    task: detect
    default_conf: 0.25
    default_iou: 0.45
    default_imgsz: 640
    notes: "YOLOv8s (11.1M params) fine-tuned for potholes. Single class: Pothole."

  # --------------------------------------------------------------------------
  # EngJamesO ships five architectures trained on the same pothole data --
  # the cleanest apples-to-apples comparison available on the Hub.
  # --------------------------------------------------------------------------
  - id: engjameso-yolov11
    name: "EngJamesO - YOLOv11"
    source: hf
    repo_id: EngJamesO/pothole-detector
    filename: models/yolov11.pt
    task: detect
    default_conf: 0.25
    notes: "Newer backbone, usually the strongest of this family."

  - id: engjameso-yolov12n
    name: "EngJamesO - YOLOv12n"
    source: hf
    repo_id: EngJamesO/pothole-detector
    filename: models/yolov12n.pt
    task: detect
    default_conf: 0.25
    notes: "Nano YOLOv12 -- fastest here; good edge-device proxy."

  - id: engjameso-yolov9c
    name: "EngJamesO - YOLOv9c"
    source: hf
    repo_id: EngJamesO/pothole-detector
    filename: models/yolov9c.pt
    task: detect
    default_conf: 0.25
    notes: "YOLOv9 compact."

  - id: engjameso-yolov8n
    name: "EngJamesO - YOLOv8n"
    source: hf
    repo_id: EngJamesO/pothole-detector
    filename: models/yolov8n.pt
    task: detect
    default_conf: 0.25
    notes: "Nano baseline for this family."

  - id: engjameso-yolov8fpn
    name: "EngJamesO - YOLOv8-FPN"
    source: hf
    repo_id: EngJamesO/pothole-detector
    filename: models/yolov8-fpn.pt
    task: detect
    default_conf: 0.25
    notes: "YOLOv8 with an FPN neck -- worth a look on small/distant potholes."

  # --------------------------------------------------------------------------
  # keremberke's segmentation set. The lab draws boxes only; masks are ignored,
  # but the box quality is a useful counterpoint to the detection models.
  # --------------------------------------------------------------------------
  - id: keremberke-yolov8n-seg
    name: "keremberke - yolov8n seg"
    source: hf
    repo_id: keremberke/yolov8n-pothole-segmentation
    filename: best.pt
    task: segment
    default_conf: 0.25
    notes: "Segmentation head. Fast; the most downloaded pothole model on the Hub."

  - id: keremberke-yolov8s-seg
    name: "keremberke - yolov8s seg"
    source: hf
    repo_id: keremberke/yolov8s-pothole-segmentation
    filename: best.pt
    task: segment
    default_conf: 0.25
    notes: "Small segmentation model."

  - id: keremberke-yolov8m-seg
    name: "keremberke - yolov8m seg"
    source: hf
    repo_id: keremberke/yolov8m-pothole-segmentation
    filename: best.pt
    task: segment
    default_conf: 0.25
    notes: "Medium segmentation model. Slowest of the three, usually tightest boxes."

  # --------------------------------------------------------------------------
  # Baseline -- a sanity check that the pipeline itself works. Off by default.
  # --------------------------------------------------------------------------
  - id: yolov8n-coco
    name: "YOLOv8n (COCO baseline)"
    source: ultralytics
    weights: yolov8n.pt
    task: detect
    default_conf: 0.35
    enabled: false
    notes: "Generic COCO model. Will NOT find potholes -- pipeline smoke test only."

  # --------------------------------------------------------------------------
  # Your own runs: point at any .pt you have trained locally.
  # --------------------------------------------------------------------------
  # - id: my-run-01
  #   name: "My YOLOv11 run 01"
  #   source: local
  #   path: weights/local/my_run_01.pt
  #   task: detect
  #   default_conf: 0.3
